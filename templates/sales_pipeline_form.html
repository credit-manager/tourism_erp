{% extends "base.html" %}
{% block content %}
<style>
.form-page{--primary:#20b874;--primary-dark:#11885a;--primary-soft:#edf9f3;--text:#182033;--muted:#708093;--border:#e4ebe6;direction:inherit;display:flex;flex-direction:column;align-items:center}
.form-page h1{font-size:26px;font-weight:950;color:var(--text);margin:0}
.form-page .sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.form-card{background:#fff;border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:0 14px 32px rgba(15,23,42,.04);max-width:1300px}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px 20px}
.form-grid .full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:12px;font-weight:900;color:var(--muted);display:flex;align-items:center;gap:5px}
.form-group label i{color:var(--primary);font-size:14px}
.form-group input,.form-group select,.form-group textarea{width:100%;border:1.5px solid var(--border);border-radius:14px;padding:0 14px;height:44px;font-size:13px;font-weight:700;color:var(--text);background:#fbfdfc;transition:.15s ease}
.form-group textarea{padding:12px 14px;height:auto;min-height:90px;resize:vertical}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(32,184,116,.12)}
.form-group select{cursor:pointer}
.form-actions{display:flex;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
.form-actions .save-btn{min-height:44px;padding:0 32px;border:0;border-radius:14px;background:linear-gradient(135deg,#bfd175,#b4c667);color:#172033;font-size:14px;font-weight:950;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.16s;box-shadow:0 8px 20px rgba(191,209,117,.3)}
.form-actions .save-btn:hover{transform:translateY(-2px);filter:brightness(.97)}
.form-actions .cancel-btn{min-height:44px;padding:0 28px;border:1.5px solid var(--border);border-radius:14px;background:#fff;color:var(--muted);font-size:13px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.16s}
.form-actions .cancel-btn:hover{background:#fbfdfc;color:var(--text)}
.header-bar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px;width:100%;max-width:1300px}
.header-bar .back-link{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border:1px solid var(--border);border-radius:12px;font-size:13px;font-weight:900;color:var(--muted);text-decoration:none;transition:.15s}
.header-bar .back-link:hover{background:#fbfdfc;color:var(--text)}
@media(max-width:1300px){.form-grid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.form-card{padding:18px}}
</style>
<div class="form-page">
<div class="header-bar">
  <div>
    <h1>{{ L("إضافة فرصة جديدة", "Add New Opportunity") if not edit else L("تعديل الفرصة", "Edit Opportunity") }}</h1>
    <p class="sub">{{ L("أدخل بيانات فرصة البيع", "Enter the sales opportunity details") }}</p>
  </div>
  <a href="/sales-pipeline" class="back-link"><i class="bi bi-arrow-right"></i> {{ L("رجوع", "Back") }}</a>
</div>
<div class="form-card">
<form method="post" action="{% if edit %}/sales-pipeline/{{ op.id }}/edit{% else %}/sales-pipeline/add{% endif %}" class="form-grid">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group full">
    <label><i class="bi bi-person-fill"></i> {{ L("العميل", "Customer") }}</label>
    <select name="customer_id" required>
      <option value="">{{ L("اختر عميل...", "Select customer...") }}</option>
      {% for c in customers %}
      <option value="{{ c.id }}" {{ 'selected' if edit and op.customer_id==c.id }}>{{ c.name }} ({{ c.phone or '—' }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label><i class="bi bi-signpost-2"></i> {{ L("المرحلة", "Stage") }}</label>
    <select name="stage">
      {% for s in stages %}
      <option value="{{ s }}" {{ 'selected' if edit and op.stage==s }}>{{ {'Lead': L('عميل محتمل', 'Lead'), 'Qualified': L('مؤهل', 'Qualified'), 'Quotation Sent': L('عرض سعر', 'Quotation Sent'), 'Negotiation': L('تفاوض', 'Negotiation'), 'Won': L('فوز', 'Won'), 'Lost': L('خسارة', 'Lost')}.get(s, s) }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label><i class="bi bi-diagram-3"></i> {{ L("المصدر", "Source") }}</label>
    <select name="source">
      <option value="direct" {{ 'selected' if edit and op.source=='direct' }}>{{ L("مباشر", "Direct") }}</option>
      <option value="facebook" {{ 'selected' if edit and op.source=='facebook' }}>{{ L("فيسبوك", "Facebook") }}</option>
      <option value="referral" {{ 'selected' if edit and op.source=='referral' }}>{{ L("توصية", "Referral") }}</option>
      <option value="advertisement" {{ 'selected' if edit and op.source=='advertisement' }}>{{ L("إعلان", "Advertisement") }}</option>
      <option value="walk_in" {{ 'selected' if edit and op.source=='walk_in' }}>{{ L("زيارة", "Walk-in") }}</option>
      <option value="other" {{ 'selected' if edit and op.source=='other' }}>{{ L("أخرى", "Other") }}</option>
    </select>
  </div>
  <div class="form-group">
    <label><i class="bi bi-geo-alt-fill"></i> {{ L("الوجهة", "Destination") }}</label>
    <input name="destination" value="{{ op.destination if edit else '' }}" placeholder="{{ L('مثال: شرم الشيخ', 'e.g. Sharm El-Sheikh') }}">
  </div>
  <div class="form-group">
    <label><i class="bi bi-wallet2"></i> {{ L("الميزانية", "Budget") }}</label>
    <input name="budget" type="number" step="0.01" value="{{ op.budget if edit else '0' }}">
  </div>
  <div class="form-group">
    <label><i class="bi bi-calendar"></i> {{ L("تاريخ السفر", "Travel Date") }}</label>
    <input name="travel_date" type="date" value="{{ op.travel_date.strftime('%Y-%m-%d') if edit and op.travel_date else '' }}">
  </div>
  <div class="form-group">
    <label><i class="bi bi-people-fill"></i> {{ L("عدد المسافرين", "Travelers") }}</label>
    <input name="travelers_count" type="number" min="1" value="{{ op.travelers_count if edit else '1' }}">
  </div>
  <div class="form-group">
    <label><i class="bi bi-percent"></i> {{ L("الاحتمالية", "Probability") }}</label>
    <input name="probability" type="number" min="0" max="100" value="{{ op.probability if edit else '50' }}">
  </div>
  <div class="form-group">
    <label><i class="bi bi-cash-stack"></i> {{ L("القيمة المتوقعة", "Expected Value") }}</label>
    <input name="expected_value" type="number" step="0.01" value="{{ op.expected_value if edit else '0' }}">
  </div>
  <div class="form-group">
    <label><i class="bi bi-person-badge"></i> {{ L("مسؤول المبيعات", "Sales Rep") }}</label>
    <select name="sales_rep_id">
      <option value="0">{{ L("— اختر —", "— Select —") }}</option>
      {% for e in employees %}
      <option value="{{ e.id }}" {{ 'selected' if edit and op.sales_rep_id==e.id }}>{{ e.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label><i class="bi bi-bell"></i> {{ L("موعد المتابعة", "Next Follow-up") }}</label>
    <input name="next_followup_date" type="date" value="{{ op.next_followup_date.strftime('%Y-%m-%d') if edit and op.next_followup_date else '' }}">
  </div>
  <div class="form-group full">
    <label><i class="bi bi-x-circle"></i> {{ L("سبب الخسارة (إن وجد)", "Loss Reason") }}</label>
    <textarea name="loss_reason" placeholder="{{ L('سبب خسارة الفرصة إن كانت Lost', 'Reason for losing the opportunity if Lost') }}">{{ op.loss_reason if edit else '' }}</textarea>
  </div>
  <div class="form-group full">
    <label><i class="bi bi-sticky"></i> {{ L("ملاحظات", "Notes") }}</label>
    <textarea name="notes" placeholder="{{ L('ملاحظات إضافية...', 'Additional notes...') }}">{{ op.notes if edit else '' }}</textarea>
  </div>
  <div class="form-actions full">
    <button class="save-btn" type="submit"><i class="bi bi-check-lg"></i> {{ L("حفظ", "Save") }}</button>
    <a href="/sales-pipeline" class="cancel-btn"><i class="bi bi-x-lg"></i> {{ L("إلغاء", "Cancel") }}</a>
  </div>
</form>
</div>
</div>
{% endblock %}
